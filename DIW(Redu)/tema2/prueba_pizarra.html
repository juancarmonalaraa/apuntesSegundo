<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
  AOS.init();
</script>
    <style>
body{
    margin: 0;
    min-height: 100vh;
    align-content: center;
    text-align: center;
}

.contenedor{
    display: flex;
    justify-content: center;
    gap: 2vw;
}

.card{
    position: relative;
    width: 30vw;
    height: 80vh;
    perspective: 1000px;

    div{
        position: absolute;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 100px;
        backface-visibility: hidden;
        transition: transform 2s;
    }

    .cardB{
        transform: rotateY(180deg);

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* si el src está vacío, no se ve el icono de imagen rota */
        img[src=""]{
            display: none;
        }
    }

    &:hover .cardA{
        transform: rotateY(180deg);
    }

    &:hover .cardB{
        transform: rotateY(360deg);
    }
}

.cardA{
    background-color: aqua;
}

.cardB{
    background-color: brown;
}
    </style>
</head>


<body>
<div class="contenedor">

    <div data-aos="fade-up"
     data-aos-anchor-placement="bottom-center" class="card">
        <div class="cardA">EL MOMO BAILON</div>
        <div class="cardB"><img src="https://media.tenor.com/PIViNMNiLSMAAAAj/momo-el-momo.gif" alt=""></div>
    </div>

    <div class="card">
        <div class="cardA">MESSIRVE</div>
        <div class="cardB"><img src="https://media1.tenor.com/m/JDF8Q20pE2cAAAAd/messi-vomit.gif" alt=""></div>
    </div>

    <div class="card">
        <div class="cardA">SOY JEFFREY EPSTEIN BIENVENIDO A MI ISLA</div>
        <div class="cardB"><img src="https://media1.tenor.com/m/DxkX_D65JeYAAAAC/epstein-dancing.gif" alt=""></div>
    </div>

</div>
 <script>
  AOS.init();
</script>
</body>

</html>
